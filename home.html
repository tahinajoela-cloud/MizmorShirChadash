<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Mizmor Shir</title>
</head>
<body>
    <div id="app-container">
        <h1>Mizmor Shir</h1>
        <div id="songs-list"></div>
    </div>
    <script src="papaparse.min.js"></script>
    <script src="script.js"></script>
    <script>
    const cachedData = localStorage.getItem('songs_data');

    if (cachedData) {
        const songs = JSON.parse(cachedData);
        const listContainer = document.getElementById('songs-list');
        listContainer.innerHTML = ''; // Fafao ny votoatiny taloha

        songs.forEach(song => {
            const div = document.createElement('div');
            div.className = 'song-item';
            // Eto no hampisehoana ny tsanganana rehetra: title, author, key, text
            div.innerHTML = `
                <h2>${song.title}</h2>
                <p><strong>Mpamorona:</strong> ${song.author}</p>
                <p><strong>Key:</strong> ${song.key}</p>
                <pre>${song.text}</pre>
                <hr>
            `;
            listContainer.appendChild(div);
        });
    } else {
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
